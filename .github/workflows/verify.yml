name: verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath -ldflags="-s -w" -o bin/agent-proof ./cmd/agent-proof
      - run: ./run-chaos.sh ./bin/agent-proof
      - run: ./bin/agent-proof run --spec spec.example.json --evidence .agent-proof/ci
      - run: ./bin/agent-proof verify-proof "$(find .agent-proof/ci -name proof.json | head -n1)"
